<script type="module">
    function delay_frame(delay) {
        let count = 0;
        return new Promise(function (resolve, reject) {
            (function raf() {
                count++;
                let id = window.requestAnimationFrame(raf);
                if (count > delay) {
                    window.cancelAnimationFrame(id);
                    resolve(true);
                }
            }())
        })
    };
    (async () => {
        const dpr = window.devicePixelRatio || 1;
        const average = (arr) => {
            let num = 0
            arr.forEach(item => {
                num += item
            })
            return num / arr.length
        }
        const EZPSY = ezpsy.default
        const ez = await ezpsy.init({
            el: document.getElementById('sinGrat'),
        });
        let a = new ezpsy.sinGrat2({
            shape: {
                x: window.innerWidth / 2 * dpr,
                y: window.innerHeight / 2 * dpr,
                r: 400,
                pixelsPerDegree: 57,
                spatialFrequency: 2,
                angle: 90,
                contrast: 0.1,
                phase: 0,
                level: 0,
                gamma: 0.5
            },
            isNoise: false
        })
        const list = []
        for (let i = 0; i < 1005; i++) {
            console.log(i)
            const t0 = performance.now()
            await ez.add(a)
            a.draw()
            const t1 = performance.now()
            list.push(t1 - t0)
            await delay_frame(1)
        }
        const data = list.slice(5)
        console.log(data.join("\n"))
        console.log("AVERAGE", data.reduce((accumulator, currentValue) => accumulator + currentValue, 0) / data.length)
    })()
</script>
