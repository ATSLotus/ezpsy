<script type="module">
    function delay_frame(delay) {
        let count = 0;
        return new Promise(function (resolve, reject) {
            (function raf() {
                count++;
                let id = window.requestAnimationFrame(raf);
                if (count > delay) {
                    window.cancelAnimationFrame(id);
                    resolve(true);
                }
            }())
        })
    };
    (async () => {
        const dpr = window.devicePixelRatio || 1;
        const average = (arr) => {
            let num = 0
            arr.forEach(item => {
                num += item
            })
            return num / arr.length
        }
        const EZPSY = ezpsy.default
        const ez = await ezpsy.init({
            el: document.getElementById('sinGrat'),
            style: {
                width: window.innerWidth,
                height: window.innerHeight,
            }
        });

        const rect = new ezpsy.Rectangle({
            shape: {
                x: window.innerWidth / 2 - 100,
                y: window.innerHeight / 2 - 100,
                width: 200,
                height: 200,
            },
            style: {
                fill: "black"
            }
        })

        const frame = 2
        for(let i = 0; i < frame * 10000; i++) {
            await ez.add(rect)
            await delay_frame(frame)
            ez.remove(rect)
            await delay_frame(frame)
        }

    })()
</script>
